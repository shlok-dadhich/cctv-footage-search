# Neutral dual light/dark theme for the CCTV search app.

[server]
maxUploadSize = 1024

[theme]
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "6px"
buttonRadius = "6px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.875rem"
baseFontSize = 14
baseFontWeight = 400
headingFontSizes = ["36px", "30px", "24px", "20px", "16px", "14px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
linkUnderline = false
paddingTop = "1rem"
paddingBottom = "2rem"

[theme.light]
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F7F8"
codeBackgroundColor = "#F4F4F5"
textColor = "#111113"
linkColor = "#2563EB"
borderColor = "#E4E4E7"
codeTextColor = "#18181B"
grayColor = "#71717A"
blueColor = "#2563EB"
greenColor = "#16A34A"
redColor = "#DC2626"
yellowColor = "#CA8A04"
orangeColor = "#EA580C"
violetColor = "#7C3AED"
chartCategoricalColors = ["#2563EB", "#71717A", "#A1A1AA", "#D4D4D8", "#16A34A", "#DC2626", "#CA8A04"]
dataframeBorderColor = "#E4E4E7"
dataframeHeaderBackgroundColor = "#F7F7F8"

[theme.dark]
primaryColor = "#3B82F6"
backgroundColor = "#0B0B0C"
secondaryBackgroundColor = "#18181B"
codeBackgroundColor = "#27272A"
textColor = "#FAFAFA"
linkColor = "#93C5FD"
borderColor = "#27272A"
codeTextColor = "#E4E4E7"
grayColor = "#A1A1AA"
blueColor = "#60A5FA"
greenColor = "#4ADE80"
redColor = "#F87171"
yellowColor = "#FACC15"
orangeColor = "#FB923C"
violetColor = "#A78BFA"
chartCategoricalColors = ["#60A5FA", "#A1A1AA", "#71717A", "#52525B", "#4ADE80", "#F87171", "#FACC15"]
dataframeBorderColor = "#27272A"
dataframeHeaderBackgroundColor = "#18181B"
dataframeHeaderTextColor = "#FAFAFA"

[theme.light.sidebar]
backgroundColor = "#F7F7F8"
secondaryBackgroundColor = "#F1F1F3"
codeBackgroundColor = "#E4E4E7"
textColor = "#111113"
borderColor = "#E4E4E7"
primaryColor = "#2563EB"
linkColor = "#2563EB"
dataframeHeaderBackgroundColor = "#F1F1F3"
dataframeBorderColor = "#E4E4E7"

[theme.dark.sidebar]
backgroundColor = "#000000"
secondaryBackgroundColor = "#18181B"
codeBackgroundColor = "#27272A"
textColor = "#FAFAFA"
borderColor = "#27272A"
primaryColor = "#3B82F6"
linkColor = "#93C5FD"
dataframeHeaderBackgroundColor = "#18181B"
dataframeBorderColor = "#27272A"
